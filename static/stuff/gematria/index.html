<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="מחשבון גימטריה עברית עם הצעות למילים בעלות ערך זהה.">
    <title>מחשבון גימטריה</title>
    <link rel="stylesheet" href="style.css">
    <script src="dic.js" defer></script>
    <script src="gematria.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <span class="eyebrow">א = 1 · י = 10 · ק = 100</span>
        <h1>מחשבון גימטריה</h1>
        <p>הקלידו מילה או ביטוי, וקבלו מיד את ערך הגימטריה ואת ההפרש בין שני ביטויים.</p>
      </header>

      <section class="calculator" aria-label="מחשבון">
        <div class="field">
          <label for="primary_word">ביטוי ראשון</label>
          <input id="primary_word" type="text" inputmode="text" autocomplete="off" placeholder="למשל: אהבה" autofocus>
          <output id="primary_value" for="primary_word">0</output>
        </div>
        <div class="operator" aria-hidden="true">−</div>
        <div class="field">
          <label for="secondary_word">ביטוי שני <small>(רשות)</small></label>
          <input id="secondary_word" type="text" inputmode="text" autocomplete="off" placeholder="למשל: אחד">
          <output id="secondary_value" for="secondary_word">0</output>
        </div>
        <div class="result" aria-live="polite">
          <span>ההפרש</span>
          <strong id="gematric_difference">0</strong>
        </div>
      </section>

      <section class="matches" aria-labelledby="matches_title">
        <div class="matches-heading">
          <div>
            <h2 id="matches_title">מילים באותו ערך</h2>
            <p id="matches_status">הקלידו ביטוי כדי לראות הצעות.</p>
          </div>
          <span id="match_count" class="count" hidden></span>
        </div>
        <ul id="word_list" class="word-list"></ul>
      </section>
    </main>
  </body>
</html>
