<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <title>Ultimate Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Two players · one screen</p>
        <h1>Ultimate<br>Tic-Tac-Toe</h1>
      </div>
      <button class="rules-button" id="rules-button" type="button" aria-expanded="false" aria-controls="rules">How to play</button>
    </header>

    <section class="rules" id="rules" hidden>
      <p>Win three small boards in a row to win. The square you choose sends your opponent to the matching small board. If that board is already won or full, they may play in any open board.</p>
    </section>

    <section class="status-bar" aria-live="polite" aria-atomic="true">
      <div class="turn-mark x" id="turn-mark" aria-hidden="true">X</div>
      <div>
        <p class="status-label" id="status-label">X to play</p>
        <p class="status-hint" id="status-hint">Choose any glowing square</p>
      </div>
      <div class="move-count"><span id="move-count">0</span><small>moves</small></div>
    </section>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Ultimate tic-tac-toe board"></div>
    </div>

    <nav class="controls" aria-label="Game controls">
      <button id="undo" type="button" disabled><span aria-hidden="true">↶</span> Undo</button>
      <button id="new-game" class="new-game" type="button">New game</button>
      <button id="redo" type="button" disabled>Redo <span aria-hidden="true">↷</span></button>
    </nav>
  </main>

  <script src="game.js"></script>
</body>
</html>
